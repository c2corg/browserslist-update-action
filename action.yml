name: browserslist-update-action
description: Runs `update-browserslist-db@latest` on a repository and proposes a pull request to merge updates.
author: Camptocamp Association
branding:
  icon: bar-chart-2
  color: green
inputs:
  github_token:
    description: Token used to push the branch and create the pull request. `GITHUB_TOKEN` or a personal access token
    required: false
    default: ${{ github.token }}
  branch:
    description: The pull request branch name
    required: false
    default: browserslist-update
  base_branch:
    description: The target branch into which the pull request will be merged. Defaults to the repository default branch
    required: false
  directory:
    description: For monorepos, directory to switch to
    required: false
    default: .
  commit_message:
    description: The message to use when committing changes
    required: false
    default: Update caniuse database
  title:
    description: The title of the pull request
    required: false
    default: 📈 Update caniuse database
  body:
    description: The body of the pull request. Defaults to a message listing caniuse-lite versions and target browser changes
    required: false
  labels:
    description: Comma separated list of existing labels to add to the pull request
    required: false
  reviewers:
    description: Comma separated list of user logins to request reviews from
    required: false
  teams:
    description: Comma separated list of team names or slugs to request reviews from
    required: false
outputs:
  has_pr:
    description: A boolean set to true when changes were found and a pull request was created or updated.
  pr_number:
    description: The pull request number, if applies.
  pr_status:
    description: Whether the pull request was created or updated, if applies.
runs:
  using: 'node24'
  main: 'dist/index.js'
