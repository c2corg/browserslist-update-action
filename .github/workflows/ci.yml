name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          INTEGRATION: 1
      - run: npm run build
      - name: Check dist is up to date
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::dist/ is outdated, run 'npm run build' and commit the result"
            exit 1
          fi
      - name: Smoke test the bundle
        run: |
          # without inputs, the action must load then fail on the missing token
          output=$(node dist/index.js || true)
          echo "$output"
          grep -q 'Input required and not supplied: github_token' <<<"$output"
